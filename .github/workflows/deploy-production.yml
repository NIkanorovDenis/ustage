name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Protect production SEO and content changes
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$PROD_PATH"
          PROD_PORT="${PROD_PORT:-22}"
          scp -P "$PROD_PORT" .deploy-critical-files "$PROD_USER@$PROD_HOST:/tmp/ustage-deploy-critical-files"
          ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          manifest="${PROD_PATH%/}/../.ustage-critical-manifest.sha256"
          current="$(mktemp)"
          trap 'rm -f "$current" /tmp/ustage-deploy-critical-files' EXIT

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ -f "${PROD_PATH%/}/$file" ]; then
              hash="$(sha256sum "${PROD_PATH%/}/$file" | cut -d' ' -f1)"
              printf '%s  %s\n' "$hash" "$file"
            else
              printf '%s  %s\n' MISSING "$file"
            fi
          done < /tmp/ustage-deploy-critical-files > "$current"

          if [ ! -f "$manifest" ]; then
            echo "Critical-file manifest is missing: $manifest" >&2
            echo "Bootstrap it on production before deploying." >&2
            exit 1
          fi

          if ! diff -u "$manifest" "$current"; then
            echo "Production critical files changed outside Git." >&2
            echo "Commit the approved production changes first; deployment was stopped without overwriting them." >&2
            exit 1
          fi
          REMOTE

      - name: Deploy tracked site files
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$PROD_PATH"
          PROD_PORT="${PROD_PORT:-22}"
          rsync -az --checksum \
            --no-perms \
            --no-times \
            --omit-dir-times \
            --delay-updates \
            --exclude='/upload/' \
            --exclude='/bitrix/.settings.php' \
            --exclude='/bitrix/.settings_extra.php' \
            --exclude='/bitrix/php_interface/dbconn.php' \
            --exclude='/bitrix/cache/' \
            --exclude='/bitrix/managed_cache/' \
            --exclude='/bitrix/stack_cache/' \
            --exclude='/bitrix/backup/' \
            --exclude='/bitrix/tmp/' \
            -e "ssh -p $PROD_PORT" \
            www/ "$PROD_USER@$PROD_HOST:$PROD_PATH/"

      - name: Run database migrations
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_IMLIGHT_LOGIN: ${{ secrets.PROD_IMLIGHT_LOGIN }}
          PROD_IMLIGHT_PASSWORD: ${{ secrets.PROD_IMLIGHT_PASSWORD }}
        run: |
          PROD_PORT="${PROD_PORT:-22}"
          test -n "$PROD_IMLIGHT_LOGIN"
          test -n "$PROD_IMLIGHT_PASSWORD"
          CREDENTIALS_PAYLOAD="$(
            jq -nc \
              --arg login "$PROD_IMLIGHT_LOGIN" \
              --arg password "$PROD_IMLIGHT_PASSWORD" \
              '{imlight: {login: $login, password: $password}}'
          )"
          printf '%s' "$CREDENTIALS_PAYLOAD" \
            | ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" migrate

      - name: Record deployed critical files
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
        run: |
          PROD_PORT="${PROD_PORT:-22}"
          scp -P "$PROD_PORT" .deploy-critical-files "$PROD_USER@$PROD_HOST:/tmp/ustage-deploy-critical-files"
          ssh -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "PROD_PATH='$PROD_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          manifest="${PROD_PATH%/}/../.ustage-critical-manifest.sha256"
          next="${manifest}.new"
          trap 'rm -f "$next" /tmp/ustage-deploy-critical-files' EXIT

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ -f "${PROD_PATH%/}/$file" ]; then
              hash="$(sha256sum "${PROD_PATH%/}/$file" | cut -d' ' -f1)"
              printf '%s  %s\n' "$hash" "$file"
            else
              printf '%s  %s\n' MISSING "$file"
            fi
          done < /tmp/ustage-deploy-critical-files > "$next"

          mv "$next" "$manifest"
          REMOTE
